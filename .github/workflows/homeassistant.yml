name: Home Assistant integration

on:
  push:
    branches:
      - "main"
    paths:
      - "custom_components/**"
      - "tests_homeassistant/**"
      - "hacs.json"
      - "pyproject.toml"
      - "requirements_test.txt"
      - ".github/workflows/homeassistant.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests_homeassistant/**"
      - "hacs.json"
      - "pyproject.toml"
      - "requirements_test.txt"
      - ".github/workflows/homeassistant.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # no brand icon in home-assistant/brands yet
          ignore: brands

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt ruff
      - run: ruff check custom_components tests_homeassistant --select E,F,W,I,B,UP,SIM
      - run: pytest -q
